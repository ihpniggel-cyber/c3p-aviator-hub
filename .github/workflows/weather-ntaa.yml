name: Météo NTAA (MetarCentral + Aeroweb)

"on":
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weather-ntaa
  cancel-in-progress: true

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: pip install deep-translator playwright

      - name: Déterminer la version de Playwright installée
        id: pw-version
        run: echo "version=$(pip show playwright | grep -i '^Version:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright / Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Installer Chromium (si non caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Dépendances système Chromium
        run: playwright install-deps chromium

      - name: Récupérer METAR/TAF/NOTAM et PDFs Aeroweb NTAA
        run: python3 .github/scripts/fetch_ntaa_weather.py

      - name: Publier si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather-ntaa.json
          git diff --staged --quiet || git commit -m "Mise à jour météo NTAA (auto)"
          git pull --rebase -X theirs origin main
          git push
